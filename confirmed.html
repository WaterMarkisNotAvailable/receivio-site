<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email confirmed — Receivio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#8FA31E">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <style>
    .confirm {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }
    .confirm-card {
      max-width: 440px;
      width: 100%;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 40px 28px;
    }
    .confirm-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: var(--on-primary);
    }
    .confirm-mark svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .confirm h1 {
      font-size: 1.75rem;
      margin: 0 0 12px;
    }
    .confirm .lead {
      margin: 0 0 28px;
    }
    .confirm .btn {
      width: 100%;
      justify-content: center;
    }
    .confirm-note {
      margin: 16px 0 0;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main class="confirm">
    <div class="confirm-card">
      <div class="confirm-mark" id="mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <p class="eyebrow">Receivio</p>
      <h1 id="title">Email confirmed</h1>
      <p class="lead" id="message">
        Your account is ready. Go back to the Receivio app and log in with
        your email and password.
      </p>
      <a class="btn btn-primary" href="receivio://auth">Open Receivio</a>
      <p class="confirm-note">
        If the button does nothing, open the app yourself. You can close this page.
      </p>
    </div>
  </main>

  <script>
    // Supabase sends expired or reused links here with the error in the hash,
    // for example #error=access_denied&error_code=otp_expired.
    var params = new URLSearchParams(window.location.hash.slice(1));
    if (params.get("error")) {
      document.getElementById("title").textContent = "Link expired";
      document.getElementById("message").textContent =
        params.get("error_code") === "otp_expired"
          ? "This confirmation link has expired or was already used. If you already confirmed, just log in. If not, sign up again in the app to get a new link."
          : (params.get("error_description") || "This confirmation link did not work.") +
            " Try logging in, or sign up again in the app to get a new link.";
      document.getElementById("mark").innerHTML =
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v6M12 17h.01"/></svg>';
    }
    // Drop the tokens from the address bar; this page does not use them.
    if (window.location.hash) history.replaceState(null, "", window.location.pathname);
  </script>
</body>
</html>
